- name: Instalar Git
  apt:
    name:
      - git
    state: present

- name: Configurar APT para que no pida confirmación
  ansible.builtin.shell: |
    echo "APT::Get::Assume-Yes \"true\";\nAPT::Get::allow \"true\";" | tee /etc/apt/apt.conf.d/90_no_prompt

- name: Crear el directorio temporal
  ansible.builtin.file:
    state: directory
    path: /tmp/build

- name: Clonar el repositorio del CTF Gameserver
  ansible.builtin.shell: |
    git clone https://github.com/fausecteam/ctf-gameserver.git
  args:
    chdir: /tmp/build

- name: Construir el paquete .deb
  ansible.builtin.shell: |
    apt-get install devscripts dpkg-dev equivs
    mk-build-deps --install debian/control
    dpkg-buildpackage --unsigned-changes --unsigned-buildinfo
  args:
    chdir: /tmp/build/ctf-gameserver

- name: Mover el paquete a /tmp
  ansible.builtin.shell: mv /tmp/build/ctf-gameserver_1.0_all.deb /tmp

- name: Borrar el directorio temporal
  ansible.builtin.file:
    state: absent
    path: /tmp/build

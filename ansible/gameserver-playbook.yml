---
- name: Comprobar los hosts disponibles
  hosts: all
  gather_facts: false
  tasks:
    - command: timeout 20 sh -c 'until nc -z $0 $1; do sleep 1; done' {{ haproxy_connection_ip }} 22
      delegate_to: localhost
      register: ping_result
      ignore_errors: true
    - group_by: key=reachable
      when: ping_result is success

- name: Configurar el gameserver
  hosts: reachable
  vars:
    ansible_python_interpreter: auto_silent
  gather_facts: true
  become: true
  vars_files:
    - variables.yml
  roles:
    - actualizar
    - debian-package
    - fausecteam.ctf_gameserver_ansible.db_prolog
    - fausecteam.ctf_gameserver_ansible.web
    - fausecteam.ctf_gameserver_ansible.db_epilog
    - fausecteam.ctf_gameserver_ansible.controller
    - fausecteam.ctf_gameserver_ansible.submission
    - fausecteam.ctf_gameserver_ansible.checker
    - webserver
    - ssh-keys
    - homepage
    - role: crear-equipos
      when: auto_registrar_equipos
    - team-downloads
    - geerlingguy.postfix

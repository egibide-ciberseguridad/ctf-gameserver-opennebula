---
- name: Comprobar los hosts disponibles
  hosts: all
  gather_facts: no
  tasks:
    - command: timeout 20 sh -c 'until nc -z $0 $1; do sleep 1; done' {{ haproxy_connection_ip }} 22
      delegate_to: localhost
      register: ping_result
      ignore_errors: yes
    - group_by: key=reachable
      when: ping_result is success

- name: Configurar el gameserver
  hosts: reachable
  vars:
    ansible_python_interpreter: auto_silent
  gather_facts: yes
  become: true
  vars_files:
    - gameserver/variables.yml
  roles:
    - actualizar
  tasks:
    # Construir el paquete .deb del CTF Gameserver
    - import_tasks: gameserver/debian-package-tasks.yml

    # Instalar los roles con los diferentes componentes
    - name: Instalar el rol db_prolog
      include_role:
        name: fausecteam.ctf_gameserver_ansible.db_prolog
    - name: Instalar el rol web
      include_role:
        name: fausecteam.ctf_gameserver_ansible.web
    - name: Instalar el rol db_epilog
      include_role:
        name: fausecteam.ctf_gameserver_ansible.db_epilog
    - name: Instalar el rol controller
      include_role:
        name: fausecteam.ctf_gameserver_ansible.controller
    - name: Instalar el rol submission
      include_role:
        name: fausecteam.ctf_gameserver_ansible.submission
    - name: Instalar el rol checker
      include_role:
        name: fausecteam.ctf_gameserver_ansible.checker

    # Configurar el servidor web
    - import_tasks: gameserver/web-tasks.yml

    # Configurar SSH
    - name: Crear el directorio /keys
      ansible.builtin.file:
        path: /keys
        state: directory
        mode: '0755'
    - name: Copiar todas las claves SSH privadas para el checker
      ansible.builtin.copy:
        src: /keys/
        dest: /keys
        mode: '0444'

    # Página de inicio
    - name: Crear una flatpage para la página de inicio
      become_user: postgres
      shell: psql -d ctf_gameserver -c "INSERT INTO public.flatpages_flatpage (id, title, content, ordering, slug) VALUES (1, '', 'Welcome to the CTF Gameserver.', 10, '');"
      ignore_errors: yes

    # Equipos
    - import_tasks: gameserver/crear-equipos-tasks.yml
      when: auto_registrar_equipos

    # Descargas
    - name: Crear la descarga del fichero id_rsa
      become_user: postgres
      shell: psql -d ctf_gameserver -c "INSERT INTO public.registration_teamdownload (filename, description) VALUES ('id_rsa', 'Clave privada SSH.');"
      ignore_errors: yes

    # Servidor de correo saliente
    - name: Instalar postfix
      include_role:
        name: geerlingguy.postfix

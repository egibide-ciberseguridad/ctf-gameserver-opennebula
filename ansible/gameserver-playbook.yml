---
- name: Comprobar los hosts disponibles
  hosts: all
  gather_facts: no
  tasks:
    - command: timeout 20 sh -c 'until nc -z $0 $1; do sleep 1; done' {{ haproxy_connection_ip }} 22
      delegate_to: localhost
      register: ping_result
      ignore_errors: yes
    - group_by: key=reachable
      when: ping_result is success

- name: Configurar el gameserver
  hosts: reachable
  vars:
    ansible_python_interpreter: auto_silent
  gather_facts: yes
  become: true
  vars_files:
    - versiones.yml
    - gameserver-variables.yml
  tasks:
    # Actualizar el sistema
    - import_tasks: upgrade-tasks.yml

    # Instalar Docker
    - import_tasks: docker-tasks.yml

    # Construir el paquete .deb del CTF Gameserver
    - import_tasks: debian-package-tasks.yml

    # Instalar los roles con los diferentes componentes
    - name: Instalar el rol db_prolog
      include_role:
        name: fausecteam.ctf_gameserver_ansible.db_prolog
    - name: Instalar el rol web
      include_role:
        name: fausecteam.ctf_gameserver_ansible.web
    - name: Instalar el rol db_epilog
      include_role:
        name: fausecteam.ctf_gameserver_ansible.db_epilog
    - name: Instalar el rol controller
      include_role:
        name: fausecteam.ctf_gameserver_ansible.controller
    - name: Instalar el rol submission
      include_role:
        name: fausecteam.ctf_gameserver_ansible.submission
    - name: Instalar el rol checker
      include_role:
        name: fausecteam.ctf_gameserver_ansible.checker

    # Configurar el servidor web
    - import_tasks: web-tasks.yml

    # Configurar SSH
    - name: Crear el directorio /keys
      ansible.builtin.file:
        path: /keys
        state: directory
        mode: '0755'
    - name: Copiar todas las claves SSH privadas para el checker
      ansible.builtin.copy:
        src: /keys/
        dest: /keys
        mode: '0444'

    # Página de inicio
    - name: Crear una flatpage para la página de inicio
      become_user: postgres
      shell: psql -d ctf_gameserver -c "INSERT INTO public.flatpages_flatpage (id, title, content, ordering, slug) VALUES (1, '', 'Welcome to the CTF Gameserver.', 10, '');"
      ignore_errors: yes

    # Equipos
    - name: Crear el usuario del equipo
      become_user: postgres
      shell: psql -d ctf_gameserver -c "INSERT INTO public.auth_user (username, password, email, is_superuser, is_staff, is_active, first_name, last_name, date_joined) VALUES ('team-{{ item }}', 'pbkdf2_sha256\$260000\$PSZkDz1MYj5I1pV2iXvWf6\$E2HW/ecZNAwPAsr5xwuuYielJkKt1fyTZFcjgGtmUgY=', 'team-{{ item }}@egibide.org', 'false', 'false', 'true', '', '', NOW());"
      ignore_errors: yes
      with_sequence: start=1 end="{{ teams }}"
    - name: Crear el registro del equipo
      become_user: postgres
      shell: psql -d ctf_gameserver -c "INSERT INTO public.registration_team (user_id, net_number, informal_email, image, affiliation, country, nop_team) VALUES ((SELECT id FROM public.auth_user WHERE username='team-{{ item }}'), {{ item }}, 'team-{{ item }}@egibide.org', '', '', 'es', false);"
      ignore_errors: yes
      with_sequence: start=1 end="{{ teams }}"

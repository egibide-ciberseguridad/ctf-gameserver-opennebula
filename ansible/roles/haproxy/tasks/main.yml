---
- name: Añadir el repositorio apt para la versión estable
  ansible.builtin.deb822_repository:
    name: haproxy
    types: deb
    uris: https://haproxy.debian.net
    suites: "{{ ansible_facts['distribution_release'] | lower }}-backports-{{ haproxy_version }}"
    components: main
    architectures: "{{ ansible_facts['architecture'] | regex_replace('x86_64', 'amd64') }}"
    signed_by: https://haproxy.debian.net/bernat.debian.org.gpg
    state: present

- name: Actualizar el índice de paquetes
  ansible.builtin.apt:
    update_cache: true

- name: Instalar HAProxy
  ansible.builtin.apt:
    name:
      - haproxy={{ haproxy_version }}.*
    state: present

- name: Usar el comando setcap para permitir a HAProxy utilizar los puertos 80 y 443
  ansible.builtin.command: setcap cap_net_bind_service=+ep /usr/sbin/haproxy

- name: Instalar el certificado autofirmado
  ansible.builtin.copy:
    src: /certs/haproxy/server.pem
    dest: /etc/ssl/private/server.pem

- name: Sobreescribir el fichero de configuración
  ansible.builtin.command: mv /var/tmp/haproxy.cfg /etc/haproxy/haproxy.cfg

- name: Reiniciar el servicio HAProxy
  ansible.builtin.service:
    name: haproxy
    state: restarted
    enabled: true

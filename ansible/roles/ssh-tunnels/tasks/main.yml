---
- name: Crear el usuario del equipo en el haproxy
  ansible.builtin.user:
    name: "team-{{ item }}"
    shell: /sbin/nologin
  with_sequence: start=1 end="{{ teams }}"

- name: Crear el directorio .ssh del usuario
  ansible.builtin.file:
    path: "/home/team-{{ item }}/.ssh"
    state: directory
    owner: "team-{{ item }}"
  with_sequence: start=1 end="{{ teams }}"

- name: Crear el fichero authorized_keys del usuario
  ansible.builtin.copy:
    src: "/keys/{{ item }}/id_rsa.pub"
    dest: "/home/team-{{ item }}/.ssh/authorized_keys"
    owner: "team-{{ item }}"
    mode: "0400"
  with_sequence: start=1 end="{{ teams }}"

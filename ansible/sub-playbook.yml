---
- name: Comprobar los hosts disponibles
  hosts: all
  gather_facts: no
  tasks:
    - command: timeout 20 sh -c 'until nc -z $0 $1; do sleep 1; done' {{ haproxy_connection_ip }} 22
      delegate_to: localhost
      register: ping_result
      ignore_errors: yes
    - group_by: key=reachable
      when: ping_result is success

- name: Configurar el nodo
  hosts: reachable
  vars:
    ansible_python_interpreter: auto_silent
  gather_facts: yes
  become: true
  tasks:
    # Actualizar el sistema
    - import_tasks: common/upgrade-tasks.yml

    # Configurar SSH
    - name: Autorizar la clave SSH pública del equipo
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ lookup('file', '/keys/'+team_id+'/id_rsa.pub') }}"

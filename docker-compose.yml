services:
  terraform-ansible:
    build:
      context: ./docker
      dockerfile: terraform-ansible/Dockerfile
      args:
        - TERRAFORM_VERSION=${TERRAFORM_VERSION}
    hostname: terraform-ansible
    environment:
      - TF_VAR_SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY}
    volumes:
      - ./terraform:/terraform
      - ./ansible:/ansible
      - ./private/ssh:/root/.ssh
      - ./private/keys:/keys
      - ./services:/services
      - ./private/hosts:/etc/hosts

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET:-10.131.0.0/24}
